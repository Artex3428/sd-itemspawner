name: Release

# Fires when a GitHub Release is published (Releases > Draft a new release > Publish).
# Builds the NUI fresh and attaches a lean, drop-in resource zip to that release.
on:
  release:
    types: [published]
  # Re-package an already published release without unpublishing it, for when the
  # packaging itself was wrong rather than the code.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to package (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  package:
    name: build + package
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build NUI
        working-directory: web
        run: |
          npm ci
          npm run build

      # Explicit allowlist of runtime files -> dist/sd-itemspawner/ so the zip extracts to a
      # correctly named resource folder. web/src, node_modules and the dev configs are
      # intentionally left out. data/ is staged empty-but-present because presets.lua writes
      # data/presets.json at runtime and SaveResourceFile needs the directory to exist.
      - name: Stage resource
        run: |
          mkdir -p dist/sd-itemspawner/web dist/sd-itemspawner/data
          cp fxmanifest.lua README.md LICENSE dist/sd-itemspawner/
          cp -r client server shared configs locales dist/sd-itemspawner/
          cp -r web/build dist/sd-itemspawner/web/build
          cp data/.gitkeep dist/sd-itemspawner/data/

      # The staging list above is an allowlist, so a new top-level directory would be dropped
      # from the zip in silence and every `require` against it would fail on start. Cross-check
      # it against what fxmanifest.lua actually declares, and fail the build instead.
      - name: Verify staged resource
        run: |
          missing=0
          paths=$(grep -oE "'[^']+\.(lua|json|html|js|css|png|jpg|webp|svg|woff2?|mp3)'" fxmanifest.lua \
            | tr -d "'" | grep -v '^@' | sed 's|/\*\*.*||; s|/\*.*||' | sort -u)
          for p in $paths; do
            if [ ! -e "dist/sd-itemspawner/$p" ]; then
              echo "::error::fxmanifest.lua declares '$p' but it is not in the staged resource"
              missing=1
            fi
          done
          if [ "$missing" != 0 ]; then
            echo "Staged resource is incomplete - add the missing path to the Stage resource step."
            exit 1
          fi
          echo "All fxmanifest paths present:"
          echo "$paths"

      - name: Zip
        run: |
          cd dist
          zip -qr "../sd-itemspawner-${TAG}.zip" sd-itemspawner

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" "sd-itemspawner-${TAG}.zip" --clobber
